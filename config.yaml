# ==========================================================================
# DTMP-Prime — configuração do pipeline
#
# Caminhos de artefatos (transformer_model, feature_norm_path, PE2/PE3_model)
# podem ser RELATIVOS: são resolvidos contra models/ e feature_norms/ e, em
# último caso, contra a raiz do repositório.
# ==========================================================================

# ---------- Genoma de referência ----------
# Obrigatório apenas para entrada em VCF. Entradas em FASTA (par ref/alt)
# dispensam o genoma. Exige o índice .fai ao lado do .fa (samtools faidx).
# Pode ser sobrescrito pela variável de ambiente DTMP_GENOME.
genome_fasta: /home/mateus25032/work/DTMP-Prime/data/hg38.fa

# ---------- Parâmetros de desenho ----------
scaffold: GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGCTAGTCCGTTATCAACTTGAAAAAGTGGCACCGAGTCGGTGC
n_jobs: 1
debug: 0
min_PBS_length: 10
max_PBS_length: 15
min_RTT_length: 10
max_RTT_length: 20
min_distance_RTT5: 5
max_ngRNA_distance: 100
sgRNA_length: 20
offset: -3
PAM: NGG

# ==========================================================================
# Escolha do modelo de predição
# Mantenha exatamente UM dos blocos abaixo descomentado.
# ==========================================================================

use_transformer: true

# ---------- MODELO DE PRODUÇÃO (Fase 2a, 14 features) ----------
transformer_model: phase2a_model.pt
use_encoding: false
feature_norm_path: feature_norm.npz

# ---------- MODELO DE COMPLETUDE (Fase 3, encoding 8x73) ----------
#transformer_model: pegRNA_Transformer_fase3.pt
#use_encoding: true
#feature_norm_path: feature_norm_fase3.npz

# ---------- FALLBACK XGBoost (use_transformer: false) ----------
